name: Build & Release Study Blocks

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release when triggered manually (requires tag ref)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: macOS Universal Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Unit Tests & Persistence Probe
        run: ./Tools/test.sh

      - name: Build Universal Release App & Package ZIP
        run: ./Tools/build.sh

      - name: Verify Universal Architectures & Signature
        run: |
          lipo -archs build/StudyBlocks.app/Contents/MacOS/StudyBlocks
          codesign --verify --deep --strict build/StudyBlocks.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBlocks-macOS
          path: build/StudyBlocks-macOS.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping overwrite."
          else
            gh release create "$TAG_NAME" build/StudyBlocks-macOS.zip \
              --title "Study Blocks ${TAG_NAME#v}" \
              --generate-notes
          fi
